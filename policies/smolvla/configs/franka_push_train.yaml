seed: 42
batch_size: 16
steps: 25000
num_workers: 2

policy:
  type: smolvla
  path: "$PRETRAINED_PATH"
  freeze_vision_encoder: true
  train_expert_only: true
  resize_imgs_with_padding: [512, 512]
  n_obs_steps: 1
  chunk_size: 50
  n_action_steps: 50
  max_state_dim: 32
  max_action_dim: 32

dataset:
  repo_id: "$DATA_PATH"

output_dir: "$OUTPUT_DIR"
save_freq: 5000
